{% extends "base.html" %}
{% block title %}Create account · Tidepool Tea{% endblock %}
{% block content %}
<section class="auth">
  <div class="auth-side">
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="90" fill="#FFBE3D"/><path d="M8 112c24-30 42 30 92 0s68 30 92 0v88H8z" fill="#10302E"/><path d="M8 140c24-26 42 24 92 0s68 24 92 0v60H8z" fill="#173C3A"/></svg>
    <h2>Make yourself at home.</h2>
    <p>An account lets you check out in one step and keep track of every order.</p>
  </div>
  <div class="auth-form">
    <h1>Create your account</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Name<input type="text" name="name" value="{{ name or '' }}" autocomplete="name" required autofocus></label>
      <label>Email<input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required><small>At least 8 characters.</small></label>
      <label>Confirm password<input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label>
      <button class="btn btn-big full" type="submit">Create account</button>
    </form>
    <p class="alt">Already registered? <a href="{{ url_for('login', next=request.args.get('next')) }}">Log in</a>.</p>
  </div>
</section>
{% endblock %}
