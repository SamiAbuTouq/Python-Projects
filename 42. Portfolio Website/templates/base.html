<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ profile.name }} – Developer</title>
  <meta name="description" content="{{ profile.sub }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <a class="logo" href="#top">{{ profile.name }}</a>
    <nav aria-label="Main">
      <a href="#work">Work</a>
      <a href="#skills">Skills</a>
      <a href="#path">Path</a>
      <a href="#credentials">Credentials</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main id="top">{% block content %}{% endblock %}</main>
  <footer class="foot">
    <p>Built with Flask in Python. © {{ profile.name }}</p>
  </footer>
</body>
</html>
