<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <h1>TaskFlow</h1>
          <p id="greeting">Plan it. Move it. Finish it.</p>
        </div>
      </div>

      <div class="controls">
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"/></svg>
          <input id="search" type="search" placeholder="Search tasks…" autocomplete="off">
        </div>
        <div class="chips" id="filters">
          <button class="chip active" data-p="all">All</button>
          <button class="chip" data-p="high"><i class="dot high"></i>High</button>
          <button class="chip" data-p="medium"><i class="dot medium"></i>Medium</button>
          <button class="chip" data-p="low"><i class="dot low"></i>Low</button>
        </div>
      </div>
    </header>

    <section class="stats">
      <div class="stat"><span id="s-total">0</span><label>Total</label></div>
      <div class="stat"><span id="s-doing">0</span><label>In progress</label></div>
      <div class="stat"><span id="s-done">0</span><label>Completed</label></div>
      <div class="progress">
        <div class="ring">
          <svg viewBox="0 0 44 44">
            <circle class="track" cx="22" cy="22" r="18"/>
            <circle class="bar" id="ring-bar" cx="22" cy="22" r="18"/>
          </svg>
          <b id="ring-text">0%</b>
        </div>
        <label>Progress</label>
      </div>
    </section>

    <main class="board" id="board">
      <section class="column" data-status="todo">
        <header><h2><i class="pill todo"></i>To Do</h2><span class="count" id="c-todo">0</span></header>
        <div class="list" id="list-todo"></div>
        <form class="quick-add" data-status="todo">
          <input type="text" placeholder="+ Add a task" maxlength="120" autocomplete="off">
        </form>
      </section>

      <section class="column" data-status="doing">
        <header><h2><i class="pill doing"></i>In Progress</h2><span class="count" id="c-doing">0</span></header>
        <div class="list" id="list-doing"></div>
        <form class="quick-add" data-status="doing">
          <input type="text" placeholder="+ Add a task" maxlength="120" autocomplete="off">
        </form>
      </section>

      <section class="column" data-status="done">
        <header><h2><i class="pill done"></i>Done</h2><span class="count" id="c-done">0</span></header>
        <div class="list" id="list-done"></div>
        <form class="quick-add" data-status="done">
          <input type="text" placeholder="+ Add a task" maxlength="120" autocomplete="off">
        </form>
      </section>
    </main>
  </div>

  <!-- Edit modal -->
  <div class="modal" id="modal" hidden>
    <form class="sheet" id="edit-form">
      <h3>Edit task</h3>
      <label>Title<input name="title" required maxlength="120"></label>
      <label>Description<textarea name="description" rows="3" maxlength="500"></textarea></label>
      <div class="row">
        <label>Priority
          <select name="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>Status
          <select name="status">
            <option value="todo">To Do</option>
            <option value="doing">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label>Due date<input type="date" name="due_date"></label>
      </div>
      <div class="actions">
        <button type="button" class="btn danger" id="delete-btn">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>
  <canvas id="confetti"></canvas>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
